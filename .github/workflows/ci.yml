name: Rebuild Windows CI
"on": [push, pull_request, workflow_dispatch]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  PYTHONNOUSERSITE: '1'
  PYTHON_DOTENV_DISABLED: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
  ANONYMIZED_TELEMETRY: 'FALSE'
  OTEL_SDK_DISABLED: 'true'
  LANGSMITH_TRACING: 'false'
  LANGCHAIN_TRACING_V2: 'false'
  OLLAMA_BASE_URL: 'http://127.0.0.1:11434'
  LLM_MODEL_NAME: 'qwen2.5:14b'
  EMBEDDING_MODEL_NAME: 'sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2'
  GENERATION_TIMEOUT_SEC: '180'
  RAG_RECALL_THRESHOLD: '1.0'
  RAG_PRECISION_THRESHOLD: '1.0'

jobs:
  hermetic-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements/ci-windows-py312.lock
      - name: Create isolated CI environment
        run: python -m venv .venv-ci
      - name: Install locked CI dependencies
        run: |
          .\.venv-ci\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements/ci-windows-py312.lock
      - name: Check installed dependency compatibility
        run: .\.venv-ci\Scripts\python.exe -m pip check
      - name: Check CI inputs and exact dependency versions
        run: .\.venv-ci\Scripts\python.exe -I -B scripts/rebuild/check_ci_inputs.py --output-dir var/checks/ci
      - name: Run isolated application and API controls
        run: .\.venv-ci\Scripts\python.exe -I -B scripts/rebuild/run_checks.py --output-dir var/checks/ci
      - name: Check Streamlit operator flow with a synthetic worker
        run: .\.venv-ci\Scripts\python.exe -I -B scripts/diagnostics/qualify_ci_ui.py --output-dir var/checks/ci/ui
      - name: Build sanitized hermetic report
        if: always()
        run: python -I -B qa/tools/report_ci.py --profile hermetic --input-dir var/checks/ci --output-dir var/checks/ci-report
      - name: Show hermetic report
        if: always()
        run: |
          if (Test-Path var/checks/ci-report/summary.md) {
            Get-Content var/checks/ci-report/summary.md -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
      - name: Preserve sanitized hermetic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ci-results
          path: var/checks/ci-report/
          if-no-files-found: warn
          retention-days: 14

  browser-smoke-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements/ci-windows-py312.lock
            qa/requirements-browser.lock
      - name: Create application environment at the owned stand path
        run: python -m venv .venv
      - name: Install locked application dependencies
        run: |
          .\.venv\Scripts\python.exe -m pip install --require-hashes --only-binary=:all: -r requirements/ci-windows-py312.lock
      - name: Check installed dependency compatibility
        run: .\.venv\Scripts\python.exe -m pip check
      - name: Install separate locked browser tools and Chromium
        run: .\.venv\Scripts\python.exe -I -B qa/tools/browser_tooling.py install --output-dir var/qa/ci-browser-install
      - name: Run one owned deterministic browser smoke and stop its stand
        run: .\.venv\Scripts\python.exe -I -B qa/tools/run_ci_browser.py --output-dir var/qa/ci-browser
      - name: Build sanitized browser report
        if: always()
        run: python -I -B qa/tools/report_ci.py --profile browser --input-dir var/qa/ci-browser --output-dir var/checks/browser-report
      - name: Show browser report
        if: always()
        run: |
          if (Test-Path var/checks/browser-report/summary.md) {
            Get-Content var/checks/browser-report/summary.md -Raw | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }
      - name: Preserve sanitized browser results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-browser-results
          path: var/checks/browser-report/
          if-no-files-found: warn
          retention-days: 14

# Live PostgreSQL/Kafka and embedding/LLM/Judge profiles remain explicit local commands.
# The browser job starts only the owned deterministic UI/API stand and real Chromium.
# Artifacts contain sanitized reports only; never upload var/qa or connection files.
# Finally cleanup is best effort if GitHub forcibly kills the runner process.
